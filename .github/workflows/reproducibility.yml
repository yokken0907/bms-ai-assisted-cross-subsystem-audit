name: reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify repository, exact source anchors, and witnesses
        run: python scripts/verify_all.py --fetch-source --strict
