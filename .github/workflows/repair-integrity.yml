name: repair-integrity-ledger

on:
  push:
    branches:
      - fix/integrity-ledger-sync-2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate integrity ledgers from checked-out tree
        run: python scripts/regenerate_integrity.py
      - name: Verify regenerated repository integrity
        run: python scripts/verify_repository.py
      - name: Verify full reproducibility chain
        run: python scripts/verify_all.py --fetch-source --strict
      - name: Commit repaired ledgers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No integrity-ledger changes required."
          else
            git commit -m "Repair integrity ledgers from canonical tree"
            git push origin HEAD:${{ github.ref_name }}
          fi
