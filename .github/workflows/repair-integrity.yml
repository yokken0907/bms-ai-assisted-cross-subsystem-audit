name: repair-integrity-ledger

on:
  push:
    branches:
      - fix/integrity-ledger-sync-2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Remove one-shot repair workflow from final tree
        run: rm .github/workflows/repair-integrity.yml
      - name: Regenerate integrity ledgers from final checked-out tree
        run: python scripts/regenerate_integrity.py
      - name: Verify regenerated repository integrity
        run: python scripts/verify_repository.py
      - name: Verify full reproducibility chain
        run: python scripts/verify_all.py --fetch-source --strict
      - name: Commit final repaired tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/repair-integrity.yml MANIFEST.json SHA256SUMS.txt
          git commit -m "Finalize integrity-ledger repair"
          git push origin HEAD:${{ github.ref_name }}
